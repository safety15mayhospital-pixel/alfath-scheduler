<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- الخلفية المستديرة الفاخرة -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#10B981" stroke-width="6" stroke-opacity="0.3" />

  <!-- شكل الدرع الذكي الخارجي -->
  <path d="M256 70 L390 130 V250 C390 340 330 415 256 445 C182 415 122 340 122 250 V130 Z" 
        fill="#047857" fill-opacity="0.25" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- رمز الكاميرا والتقويم والذكاء المتقاطع -->
  <!-- التقويم -->
  <rect x="180" y="170" width="152" height="130" rx="20" fill="#065F46" stroke="#34D399" stroke-width="8" />
  <path d="M180 215 H332" stroke="#34D399" stroke-width="8" />
  <!-- دبابيس التقويم -->
  <line x1="215" y1="150" x2="215" y2="180" stroke="#6EE7B7" stroke-width="10" stroke-linecap="round" />
  <line x1="297" y1="150" x2="297" y2="180" stroke="#6EE7B7" stroke-width="10" stroke-linecap="round" />

  <!-- عدسة الكاميرا الذكية في المنتصف -->
  <circle cx="256" cy="260" r="32" fill="#022C22" stroke="#A7F3D0" stroke-width="7" />
  <circle cx="256" cy="260" r="14" fill="#34D399" filter="url(#glow)" />
  <circle cx="262" cy="254" r="5" fill="#FFFFFF" />

  <!-- علامة إشارة ذكية / موجات رادارية / واي فاي فوق الدرع -->
  <path d="M210 345 C230 360 282 360 302 345" fill="none" stroke="#34D399" stroke-width="8" stroke-linecap="round" />
  <path d="M195 375 C230 398 282 398 317 375" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-opacity="0.7" />

  <!-- نص الفتح -->
  <text x="256" y="475" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="900" font-size="34" fill="#E2E8F0" letter-spacing="2">
    AL-FATH SMART
  </text>
</svg>
